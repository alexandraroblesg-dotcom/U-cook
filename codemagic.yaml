
workflows:
  web-demo:
    name: U-Cook Web Demo
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Instalar dependencias
        script: flutter pub get

      - name: Analizar codigo
        script: flutter analyze

      - name: Ejecutar pruebas
        script: flutter test

      - name: Compilar version web
        script: flutter build web --release

    artifacts:
      - build/web/**

  android-demo:
    name: U-Cook Android Demo
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Instalar dependencias
        script: flutter pub get

      - name: Ejecutar pruebas
        script: flutter test

      - name: Compilar APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
